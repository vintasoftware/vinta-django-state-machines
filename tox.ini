# Django 5.2 supports Python 3.10-3.13; Django 6.0 and later need 3.12+, which is why
# the matrix is expressed as explicit factor pairs rather than a full product.
[tox]
requires =
    tox>=4.24
    tox-uv>=1.25
env_list =
    py310-dj52
    py311-dj52
    py312-dj{52,60}
    py313-dj{52,60,main}
    py314-dj{60,main}
    lint
    types
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
description = Run the test suite on this interpreter against the pinned Django
package = wheel
wheel_build_env = .pkg
dependency_groups = dev
deps =
    dj52: django>=5.2,<6.0
    dj60: django>=6.0,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz
# Django's main branch breaks for reasons that are not this project's fault, so those
# environments report without failing the run.
ignore_outcome =
    djmain: true
set_env =
    PYTHONDEVMODE = 1
commands =
    # The scope model is swappable, and Meta.swappable is resolved once per process, so
    # the swapped configuration needs its own settings module and its own run.  It goes
    # first and reports nothing: it seeds the coverage data the main run then appends to,
    # so the single report at the end covers both configurations.
    pytest tests/swapped -q -p no:cacheprovider --ds=tests.settings_swapped \
        --cov --cov-report=
    pytest {posargs:--cov --cov-append --cov-report=term-missing}

[testenv:lint]
runner = uv-venv-lock-runner
description = Check formatting and lint rules
dependency_groups = dev
skip_install = true
commands =
    ruff check .
    ruff format --check .

[testenv:types]
runner = uv-venv-lock-runner
description = Type check with mypy and django-stubs
dependency_groups = dev
commands =
    mypy

[testenv:build]
runner = uv-venv-lock-runner
description = Build the sdist and wheel and check the metadata
skip_install = true
deps =
    build
    twine
commands =
    python -m build
    twine check dist/*
