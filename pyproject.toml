[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vinta-django-state-machines"
version = "0.4.0"
description = "Data-driven, versioned state machines for Django: a status catalog, published state-machine versions pinned per record, guarded transitions and an append-only status history."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinta Software", email = "contact@vinta.com.br" }]
maintainers = [{ name = "Vinta Software", email = "contact@vinta.com.br" }]
keywords = [
    "django",
    "state-machine",
    "workflow",
    "status",
    "versioning",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["django>=5.2"]

[project.urls]
Homepage = "https://github.com/vintasoftware/vinta-django-state-machines"
Documentation = "https://github.com/vintasoftware/vinta-django-state-machines#readme"
Repository = "https://github.com/vintasoftware/vinta-django-state-machines"
Issues = "https://github.com/vintasoftware/vinta-django-state-machines/issues"
Changelog = "https://github.com/vintasoftware/vinta-django-state-machines/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2",
    "mypy>=1.15",
    "pre-commit>=4.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-django>=4.10",
    "ruff>=0.9",
    "tox>=4.24",
    "tox-uv>=1.25",
]

[tool.hatch.build.targets.wheel]
packages = ["vinta_state_machines"]

[tool.hatch.build.targets.sdist]
include = [
    "/vinta_state_machines",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/tox.ini",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 99
target-version = "py310"
src = ["vinta_state_machines", "tests"]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FA",   # flake8-future-annotations
    "I",    # isort
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "RUF012", # mutable class attrs need ClassVar - noisy with Django Meta
    "N818",   # exceptions read as conditions here, the way Django's own do
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DJ008", "PT018", "RUF043"]
"vinta_state_machines/migrations/*" = ["E501"]
# Shadows the stdlib ``types`` only as a submodule, which Python 3 cannot confuse with
# it. Named to match ``vinta_audit_logs.types``, whose DTOs these mirror.
"vinta_state_machines/types.py" = ["A005"]

[tool.ruff.lint.isort]
known-first-party = ["vinta_state_machines"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
# No python_version pin: django-stubs' own stubs use 3.11+ constructs, and pinning an
# older version silently degrades TextChoices to a plain tuple.
files = ["vinta_state_machines", "tests"]
strict = true
plugins = ["mypy_django_plugin.main"]
warn_unreachable = true
show_error_codes = true
exclude = ['/migrations/']

[[tool.mypy.overrides]]
# ModelAdmin and TabularInline are not subscriptable at runtime, and the checker-only
# alias dance those would need buys nothing here: every method is annotated already.
module = ["vinta_state_machines.admin"]
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_unreachable = false
warn_return_any = false
# Tests assert on results the engine legitimately types as optional; guarding every one
# of them would bury the assertion being made.
disable_error_code = ["union-attr", "attr-defined"]

[tool.django-stubs]
django_settings_module = "tests.settings"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
# tests/swapped runs under its own settings module: the scope model is swapped there,
# and Meta.swappable cannot be moved once the models are imported.
addopts = "--strict-markers --strict-config -ra --ignore=tests/swapped"
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
# source_pkgs, not a path: under tox the package is measured where the wheel installed it.
source_pkgs = ["vinta_state_machines"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.paths]
source = ["vinta_state_machines", "*/site-packages/vinta_state_machines"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
